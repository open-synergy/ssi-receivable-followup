scenarios:
  - name: "Receivable Follow Up - Operating Unit propagation"
    steps:
      - step: "Setup - create receivable follow up type"
        action: "create"
        model: "receivable_follow_up_type"
        save_as: "type"
        values:
          name: "Test RFU OU Type"
          code: "TRFUOUTYPE1"
          max_date_due: 60
          min_date_due: 0

      - step: "Create receivable_follow_up with operating_unit_id"
        action: "create"
        model: "receivable_follow_up"
        save_as: "rfu"
        as_user: "base.user_admin"
        values:
          type_id: "REC: type.id"
          currency_id: "REC: company.currency_id.id"
          collector_id: "REC: user.id"
          date_start: 2024-01-01
          date_end: 2024-01-31
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert receivable_follow_up operating_unit_id is set"
        action: "assert"
        target: "rfu"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Receivable Follow Up - ir.rule restricts access by operating unit"
    steps:
      - step: "Setup - create receivable follow up type"
        action: "create"
        model: "receivable_follow_up_type"
        save_as: "type"
        values:
          name: "Test RFU OU Rule Type"
          code: "TRFUOUTYPE2"
          max_date_due: 60
          min_date_due: 0

      - step: "Create receivable_follow_up with main operating unit"
        action: "create"
        model: "receivable_follow_up"
        save_as: "rfu"
        as_user: "base.user_admin"
        values:
          type_id: "REC: type.id"
          currency_id: "REC: company.currency_id.id"
          collector_id: "REC: user.id"
          date_start: 2024-01-01
          date_end: 2024-01-31
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Create user restricted to a different operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Restricted Receivable Follow Up OU User"
          login: "restricted_receivable_follow_up_ou_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_receivable_follow_up.receivable_follow_up_user_group"
                - "REF:
                  ssi_receivable_follow_up_operating_unit.receivable_follow_up_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REF: operating_unit.b2b_operating_unit"

      - step: "Restricted user cannot see the record"
        action: "search"
        model: "receivable_follow_up"
        domain: [["id", "=", "REC: rfu.id"]]
        save_as: "search_result"
        as_user: "restricted_user"
        expect_count: 0

      - step: "Restricted user cannot write the record"
        action: "write"
        target: "rfu"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"
        values:
          note: "Restricted write attempt"
